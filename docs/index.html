<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: summary band (how it works, your resume, tiles) over a two-column list + sidebar. */
:root {
  --bg: #f5f4f0; --panel: #ffffff; --ink: #1b1a17; --muted: #6a675f; --line: #e3e0d8; --soft: #efede7;
  --accent: #0e6655;
  --strong: #17703f; --strong-bg: #e2f2e8;
  --good: #8a5a00; --good-bg: #f9edcf;
  --low: #6a675f; --low-bg: #ecebe6;
  --gap: #a8401b; --gap-bg: #fae6dc;
  --new: #2b4fd8;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --panel: #1c1c19; --ink: #ecebe6; --muted: #a09d94; --line: #2e2d29; --soft: #252521;
    --accent: #4fc2a9;
    --strong: #6fd69a; --strong-bg: #173525;
    --good: #e8b54d; --good-bg: #3a2e12;
    --low: #a09d94; --low-bg: #2a2925;
    --gap: #f08a62; --gap-bg: #3d2117;
    --new: #8ea6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --panel: #1c1c19; --ink: #ecebe6; --muted: #a09d94; --line: #2e2d29; --soft: #252521;
  --accent: #4fc2a9; --strong: #6fd69a; --strong-bg: #173525; --good: #e8b54d; --good-bg: #3a2e12;
  --low: #a09d94; --low-bg: #2a2925; --gap: #f08a62; --gap-bg: #3d2117; --new: #8ea6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1272px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 22px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; font-weight: 700; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 14px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.how summary { cursor: pointer; font-weight: 600; }
.steps { list-style: none; margin: 14px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; gap: 4px; align-content: start; font-size: 14px; color: var(--muted); }
.steps li::before { content: counter(step); font: 600 13px/1 var(--mono); color: var(--accent); }
.steps b { color: var(--ink); font-weight: 600; font-size: 15px; }

.me { display: grid; gap: 12px; }
.me h2 { margin: 0; font-size: 16px; }
.me p { margin: 0; color: var(--muted); font-size: 14px; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.btn { display: inline-block; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; border: 1px solid var(--ink);
  font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.linkbtn { font-size: 14px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 2px; text-decoration: underline; }
textarea { width: 100%; min-height: 140px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--gap); }
.mestats { font: 500 13px var(--mono); color: var(--muted); }
.editor { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.editor label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.editor input { color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; min-width: 0; }
.editor input[type=number] { width: 72px; }
.xchip { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; padding: 2px 4px 2px 10px; border-radius: 999px; background: var(--strong-bg); color: var(--strong); }
.xchip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 5px; border-radius: 999px; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 6px 0 22px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font: 600 26px/1.1 var(--mono); letter-spacing: -0.02em; }
.tile small { color: var(--muted); font-size: 13px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input[type=search], .filters select { color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.filters input[type=search] { flex: 1 1 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font-size: 14px; border: 0; background: var(--bg); color: var(--muted); padding: 7px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.small button { font-size: 13px; padding: 4px 9px; }
.filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.filters label.off { opacity: .5; }
.filters input[type=range] { width: 110px; accent-color: var(--accent); }
.tech { flex: 1 1 100%; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.techhead { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.techhead b { font-size: 14px; }
.techhead input { font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; min-width: 0; flex: 0 1 200px; }
.tchip { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.tchip span { color: var(--muted); font: 500 11px var(--mono); margin-left: 4px; }
.tchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.tchip[aria-pressed="true"] span { color: inherit; opacity: .8; }
.count { color: var(--muted); font-size: 13px; margin: 0 2px 10px; }

.job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.job[open] { border-color: var(--accent); }
.job summary { list-style: none; cursor: pointer; display: grid; gap: 4px 16px; padding: 14px 16px;
  grid-template-columns: 64px minmax(0, 1fr) 120px 110px 92px; align-items: center; border-radius: 12px; }
.job summary::-webkit-details-marker { display: none; }
.score { font: 600 17px/1 var(--mono); text-align: center; padding: 9px 0; border-radius: 9px; }
.score.strong { color: var(--strong); background: var(--strong-bg); }
.score.good { color: var(--good); background: var(--good-bg); }
.score.low { color: var(--low); background: var(--low-bg); }
.role b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.role span { color: var(--muted); font-size: 14px; }
.new { display: inline-block; font: 600 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--new); border: 1px solid currentColor; border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: 2px; }
.meta { font-size: 13px; color: var(--muted); }
.meta strong { display: block; color: var(--ink); font-weight: 500; font-size: 14px; }
.na { color: var(--muted); font-style: italic; }

.detail { border-top: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; }
.verdict { font-size: 15px; }
.verdict b.strong { color: var(--strong); } .verdict b.good { color: var(--good); } .verdict b.low { color: var(--low); }
.detail h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--ink); }
.chip.hit { background: var(--strong-bg); color: var(--strong); }
.chip.miss { background: var(--gap-bg); color: var(--gap); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.loc { color: var(--muted); font-size: 13px; }

#more { display: block; margin: 14px auto 0; font-weight: 600; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 18px; cursor: pointer; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); }

aside { display: grid; gap: 14px; position: sticky; top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h2 { margin: 0 0 4px; font-size: 15px; }
.card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.gaps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gaps li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; }
.gaps i { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.gaps i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--bar, var(--gap)); }
.gaps span { color: var(--muted); font: 500 12px var(--mono); }
.src { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 260px; overflow: auto; }
.src li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.src li span { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.src.bad li span { font-family: var(--sans); white-space: normal; text-align: right; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 10px; }

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; }
}
@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .steps { grid-template-columns: 1fr; }
  .job summary { grid-template-columns: 56px minmax(0, 1fr); }
  .job summary .meta { grid-column: 2; display: flex; gap: 6px; }
  .job summary .meta strong { display: inline; }
}
@media (prefers-reduced-motion: no-preference) { .drop { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Job <span>Radar</span></h1>
      <div class="sub" id="who"></div>
    </div>
    <div class="sub" id="updated"></div>
  </header>

  <details class="panel how" id="how"><summary>How jobs are found</summary><ol class="steps" id="steps"></ol></details>

  <section class="panel me" id="me" aria-labelledby="me-title"></section>
  <input type="file" id="file" hidden accept=".pdf,.docx,.txt,.md,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

  <section class="tiles" id="tiles"></section>

  <div class="layout">
    <main>
      <div class="panel filters" role="search">
        <input type="search" id="q" placeholder="Search title, company, skill…" aria-label="Search jobs">
        <select id="role" aria-label="Role"><option value="">All roles</option></select>
        <select id="level" aria-label="Seniority"><option value="">All levels</option></select>
        <select id="type" aria-label="Job type"><option value="">All job types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Not specified</option></select>
        <div class="seg" id="where" role="group" aria-label="Location">
          <button type="button" aria-pressed="true" data-v="">All</button><button type="button" aria-pressed="false" data-v="US">US</button><button type="button" aria-pressed="false" data-v="Canada">Canada</button><button type="button" aria-pressed="false" data-v="Remote">Remote</button>
        </div>
        <label id="minlabel">Resume match ≥ <input type="range" id="min" min="0" max="90" step="5" value="0"> <span id="minv">0%</span></label>
        <select id="src" aria-label="Source"><option value="">All sources</option></select>
        <label><input type="checkbox" id="fresh"> New only</label>
        <select id="sort" aria-label="Sort"><option value="score">Best match</option><option value="new">Newest</option></select>
        <button class="linkbtn" id="reset" type="button">Reset filters</button>
        <div class="tech">
          <div class="techhead">
            <b>Technologies</b>
            <div class="seg small" id="mode" role="group" aria-label="How to combine technologies">
              <button type="button" aria-pressed="true" data-v="any">Any selected</button><button type="button" aria-pressed="false" data-v="all">All selected</button>
            </div>
            <input id="techq" list="techlist" placeholder="Add a technology…" aria-label="Add a technology">
          </div>
          <div class="chips" id="techs"></div>
        </div>
      </div>
      <div class="count" id="count"></div>
      <div id="list"></div>
      <button id="more" type="button" hidden>Show more</button>
    </main>

    <aside>
      <section class="card">
        <h2 id="gaptitle"></h2>
        <p id="gapnote"></p>
        <ol class="gaps" id="gaps"></ol>
      </section>
      <section class="card">
        <h2>Sources</h2>
        <p id="srcsum"></p>
        <ul class="src" id="srcok"></ul>
        <details class="more" id="srcbadwrap"><summary></summary><ul class="src bad" id="srcbad"></ul></details>
      </section>
    </aside>
  </div>
  <datalist id="techlist"></datalist>
</div>

<script src="jobs.js"></script>
<script>
const D = window.JOB_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 864e5;
const ago = iso => { if (!iso) return "—"; const d = (Date.now() - new Date(iso)) / DAY; return d < 1 ? "today" : d < 2 ? "yesterday" : Math.floor(d) + "d ago"; };
const isNew = j => Date.now() - new Date(j.first_seen) < 2 * DAY;
const tier = s => s == null ? "low" : s >= 70 ? "strong" : s >= 50 ? "good" : "low";
const list = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const store = {  // per-browser memory; the page works the same without it
  get: k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const LEVELS = ["Junior", "Mid", "Senior", "Staff+"];
const DEFAULTS = { q: "", role: "", level: "", type: "", where: "", min: 0, src: "", fresh: false, sort: "score", techs: [], mode: "any" };
const state = { ...DEFAULTS, ...(store.get("job-radar-filters") || {}), limit: 50 };
let me = store.get("job-radar-resume");  // { name, skills: [...], years } — the resume text itself is never kept
let editing = false, pasting = false, status = "";

// ---- Resume reading and matching (all in this browser) ----
const rxEscape = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const SKILLS = Object.entries(D?.keywords || {}).map(([name, aliases]) => [name, aliases.map(a => a.startsWith("re:")
  ? new RegExp(a.slice(3))
  : new RegExp("(?<![A-Za-z0-9])" + rxEscape(a.replace(/^=/, "")) + "(?![A-Za-z0-9+#])", a.startsWith("=") ? "" : "i"))]);
const detectSkills = text => SKILLS.filter(([, rxs]) => rxs.some(r => r.test(text))).map(([n]) => n);
const detectYears = text => { const m = text.match(/(\d{1,2})\s*\+?\s*years?(?:\s+of)?(?:\s+[\w\/&-]+){0,5}?\s+experience/i); return m ? +m[1] : null; };
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
const loadScript = src => new Promise((ok, fail) => {
  if (document.querySelector(`script[src="${src}"]`)) return ok();
  const s = Object.assign(document.createElement("script"), { src, onload: ok,
    onerror: () => fail(new Error("Couldn't load the file reader. Check the internet connection, or paste the text instead.")) });
  document.head.append(s);
});

async function readFile(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "pdf") {
    // Loading the worker as a plain script lets PDF.js run on the main thread, so no worker file is needed.
    await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
    await loadScript(CDN + "pdf.js/3.11.174/pdf.worker.min.js");
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(t => t.str).join(" ") + "\n";
    return text;
  }
  if (ext === "docx") {
    await loadScript(CDN + "mammoth/1.6.0/mammoth.browser.min.js");
    return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  if (["txt", "md", "text"].includes(ext) || file.type.startsWith("text/")) return file.text();
  throw new Error("That file type isn't supported. Use a PDF, Word (.docx) or text file, or paste the text.");
}

function useResume(name, text) {
  const skills = detectSkills(text);
  if (!skills.length) { status = "No skills were recognized in that resume. Check it's the right file, or paste the text."; return renderAll(); }
  me = { name, skills, years: detectYears(text) };
  status = ""; pasting = false;
  store.set("job-radar-resume", me);
  if (state.sort !== "new") state.sort = "score";
  renderAll();
}

let reads = 0;
async function onFile(file) {
  if (!file) return;
  const read = ++reads;  // if another file is picked meanwhile, only the latest one counts
  status = `Reading ${file.name}…`; renderMe();
  try { const text = await readFile(file); if (read === reads) useResume(file.name, text); }
  catch (e) { if (read === reads) { status = e.message || "Couldn't read that file. Try a PDF, .docx or .txt, or paste the text."; renderMe(); } }
}

function score() {
  const mine = new Set(me?.skills || []);
  D.jobs.forEach(j => {
    j.matched = j.skills.filter(k => mine.has(k));
    j.missing = j.skills.filter(k => !mine.has(k));
    j.score = !me ? null : j.skills.length ? Math.round(100 * j.matched.length / j.skills.length) : 0;
  });
}

// ---- Rendering ----
function renderMe() {
  const err = status && !status.startsWith("Reading");
  const statusLine = status ? `<p class="status${err ? " err" : ""}" role="status">${esc(status)}</p>` : "";
  if (!me) {
    $("#me").innerHTML = `
      <h2 id="me-title">Add your resume to score every job</h2>
      <div class="drop" id="drop">
        <p>Drop a PDF, Word (.docx) or text file here, or choose one. It's read in this browser and never uploaded anywhere.</p>
        <div class="row"><button class="btn" type="button" id="pick">Choose file</button>
          <button class="linkbtn" type="button" id="pastebtn">${pasting ? "Hide paste box" : "Paste text instead"}</button></div>
        ${pasting ? `<textarea id="pastetext" aria-label="Resume text" placeholder="Paste your resume text here"></textarea>
          <div class="row"><button class="btn ghost" type="button" id="usepaste">Use this text</button></div>` : ""}
        ${statusLine}
      </div>`;
    const drop = $("#drop");
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); onFile(e.dataTransfer.files[0]); });
  } else {
    const yrs = me.years ? `${me.years}+ years` : "years not found";
    $("#me").innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div><h2 id="me-title">Your resume: ${esc(me.name)}</h2><span class="mestats">${me.skills.length} skills · ${esc(yrs)}</span></div>
        <div class="row"><button class="btn ghost" type="button" id="editbtn" aria-expanded="${editing}">${editing ? "Done" : "Edit skills"}</button>
          <button class="btn ghost" type="button" id="pick">Replace</button>
          <button class="linkbtn" type="button" id="forget">Remove</button></div>
      </div>
      ${statusLine}
      ${editing ? `<div class="editor">
        <div class="row"><label>Years of experience <input type="number" id="years" min="0" max="50" value="${me.years ?? ""}"></label>
          <label>Add a skill <input id="addskill" list="techlist" placeholder="e.g. Go"></label></div>
        <div class="chips">${me.skills.map(k => `<span class="xchip">${esc(k)}<button type="button" data-k="${esc(k)}" aria-label="Remove ${esc(k)}">×</button></span>`).join("")}</div>
      </div>` : ""}`;
  }
}

function renderHeader() {
  $("#who").textContent = me ? `Matched against ${me.name}` : "Add your resume to see how well you match each job";
  const scores = D.jobs.map(j => j.score).filter(s => s != null).sort((a, b) => a - b);
  const tiles = [
    [D.jobs.length, "jobs found"],
    [D.jobs.filter(isNew).length, "new in last 48h"],
    [me ? D.jobs.filter(j => j.score >= 70).length : "—", "strong fits (70%+)"],
    [scores.length ? scores[Math.floor(scores.length / 2)] + "%" : "—", "median match"],
  ];
  $("#tiles").innerHTML = tiles.map(([v, l]) => `<div class="tile"><b>${v}</b><small>${l}</small></div>`).join("");
  $("#minlabel").classList.toggle("off", !me);
  $("#min").disabled = !me;
}

function why(j) {
  const n = j.matched.length, t = j.skills.length;
  if (!t) return "This posting doesn't name any skills the dashboard recognizes, so it can't be scored. Open it to read the details.";
  const label = { strong: "Strong fit", good: "Good fit", low: "Stretch" }[tier(j.score)];
  let s = `<b class="${tier(j.score)}">${label}.</b> Your resume covers ${n} of the ${t} skills this posting names`
    + (n ? `, including ${esc(list(j.matched.slice(0, 4)))}. ` : ". ");
  if (j.years_required == null) s += "No explicit years-of-experience requirement found. ";
  else if (!me.years) s += `It asks for ${j.years_required}+ years. `;
  else if (me.years >= j.years_required) s += `It asks for ${j.years_required}+ years; you have ${me.years}+. `;
  else s += `It asks for ${j.years_required}+ years against your ${me.years}+, so lead with scope and impact. `;
  s += j.missing.length ? `To close the gap, add ${esc(list(j.missing.slice(0, 3)))} to your resume if you've used them, or address them in a cover note.`
                        : "No skill gaps against this posting.";
  return s;
}

function hasTech(j) {
  if (!state.techs.length) return true;
  return state.mode === "all" ? state.techs.every(t => j.skills.includes(t)) : state.techs.some(t => j.skills.includes(t));
}

function filtered(withTech = true) {
  const q = state.q.toLowerCase();
  const out = D.jobs.filter(j => (!me || j.score >= state.min)
    && (!withTech || hasTech(j))
    && (!state.role || j.role === state.role)
    && (!state.level || j.level === state.level)
    && (!state.where || j.where.includes(state.where))
    && (!state.type || j.type === state.type)
    && (!state.src || j.source === state.src)
    && (!state.fresh || isNew(j))
    && (!q || [j.title, j.company, j.location, ...j.skills].join(" ").toLowerCase().includes(q)));
  const newest = (a, b) => new Date(b.posted || b.first_seen) - new Date(a.posted || a.first_seen);
  return out.sort(me && state.sort === "score" ? (a, b) => b.score - a.score || b.matched.length - a.matched.length || newest(a, b) : newest);
}

function row(j) {
  const url = /^https?:\/\//.test(j.url) ? j.url : "#";
  const applicants = j.applicants == null ? '<span class="na">Not available</span>' : esc(j.applicants);
  const chips = (a, cls) => a.map(k => `<span class="chip ${cls}">${esc(k)}</span>`).join("") || '<span class="na">None</span>';
  const detail = me
    ? `<div class="verdict">${why(j)}</div>
       <div><h3>You have (${j.matched.length})</h3><div class="chips">${chips(j.matched, "hit")}</div></div>
       <div><h3>Missing (${j.missing.length})</h3><div class="chips">${chips(j.missing, "miss")}</div></div>`
    : `<div><h3>Skills in this posting (${j.skills.length})</h3><div class="chips">${chips(j.skills, "")}</div></div>
       <p class="na" style="margin:0">Add your resume above to see which of these you have.</p>`;
  return `<details class="job"><summary>
      <div class="score ${tier(j.score)}" aria-label="${me ? j.score + "% match" : "no resume yet"}">${me ? j.score + "%" : "—"}</div>
      <div class="role"><b>${esc(j.title)}${isNew(j) ? '<span class="new">New</span>' : ""}</b><span>${esc(j.company)} · ${esc(j.where.join(" / "))} · ${esc(j.level)} ${esc(j.role)} · ${esc(j.type)}</span></div>
      <div class="meta"><strong>${me ? `${j.matched.length}/${j.skills.length}` : j.skills.length}</strong> ${me ? "keywords" : "skills named"}</div>
      <div class="meta"><strong>${applicants}</strong> applicants</div>
      <div class="meta"><strong>${ago(j.posted)}</strong> ${esc(j.source)}</div>
    </summary>
    <div class="detail">
      ${detail}
      <div class="actions"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open posting ↗</a>
        <span class="loc">${esc(j.location)}${j.years_required ? ` · asks ${j.years_required}+ yrs` : ""}</span></div>
    </div></details>`;
}

function renderTechs() {
  const counts = {};
  filtered(false).forEach(j => j.skills.forEach(k => counts[k] = (counts[k] || 0) + 1));
  const shown = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 24);
  state.techs.forEach(t => shown.includes(t) || shown.unshift(t));
  $("#techs").innerHTML = shown.map(k => `<button type="button" class="tchip" data-k="${esc(k)}" aria-pressed="${state.techs.includes(k)}">${esc(k)}<span>${counts[k] || 0}</span></button>`).join("");
}

function render() {
  const { limit, ...keep } = state;
  store.set("job-radar-filters", keep);
  renderTechs();
  const jobs = filtered();
  $("#count").textContent = `${jobs.length} of ${D.jobs.length} jobs` + (state.techs.length ? ` · ${state.mode === "all" ? "all of" : "any of"} ${state.techs.join(", ")}` : "");
  $("#list").innerHTML = jobs.slice(0, state.limit).map(row).join("") || '<div class="empty">No jobs match these filters.</div>';
  $("#more").hidden = jobs.length <= state.limit;

  const tally = {};
  jobs.forEach(j => (me ? j.missing : j.skills).forEach(k => tally[k] = (tally[k] || 0) + 1));
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $("#gaptitle").textContent = me ? "Most-requested skills you're missing" : "Most-requested skills";
  $("#gapnote").textContent = me ? "Across the jobs shown. Add any you've actually used to your resume." : "Across the jobs shown.";
  $("#gaps").style.setProperty("--bar", me ? "var(--gap)" : "var(--accent)");
  $("#gaps").innerHTML = top.map(([k, n]) => `<li>${esc(k)}<span>${n} job${n > 1 ? "s" : ""}</span><i style="--w:${Math.round(100 * n / top[0][1])}%"></i></li>`).join("")
    || '<li class="na">Nothing to show for this view.</li>';
}

function renderAll() { score(); renderMe(); renderHeader(); render(); }

function init() {
  if (!D) {
    $("#list").innerHTML = '<div class="empty">No data yet. Run <code>python3 fetch_jobs.py</code>, then reload.</div>';
    return;
  }
  $("#updated").textContent = `Updated ${ago(D.generated_at)} · ${new Date(D.generated_at).toLocaleString()}`;
  const rules = D.rules || { max_age_days: 30 };
  const steps = [
    [`Poll ${D.sources.length} sources`, "Every 6 hours a scheduled job reads company career boards (Greenhouse, Ashby, Lever, Workday, SmartRecruiters, Workable) and job boards such as The Muse, Himalayas and HN Who's Hiring."],
    ["Apply the rules", `Keeps software engineering roles in the US, Canada or remote posted in the last ${rules.max_age_days} days, and tags each one with its skills, role, seniority and job type.`],
    ["Match your resume", "Add your resume. It's read in this browser, never uploaded, and every job gets a match %, the skills you have and the ones you're missing."],
    ["Pick what you want", "Filter by role, seniority, technology, location or job type. Your resume and filters are remembered in this browser."],
  ];
  $("#steps").innerHTML = steps.map(([t, d]) => `<li><b>${esc(t)}</b>${esc(d)}</li>`).join("");

  const ok = D.sources.filter(s => s.ok), bad = D.sources.filter(s => !s.ok), kinds = {};
  ok.forEach(s => kinds[s.kind] = (kinds[s.kind] || 0) + 1);
  $("#srcsum").textContent = `${ok.length} of ${D.sources.length} sources read on the last run: `
    + Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k} ${n}`).join(" · ") + ". Kept / seen per source:";
  $("#srcok").innerHTML = ok.map(s => `<li><a href="${/^https?:\/\//.test(s.url) ? esc(s.url) : "#"}" target="_blank" rel="noopener">${esc(s.name)}</a><span>${s.kept}/${s.seen}</span></li>`).join("");
  $("#srcbadwrap").hidden = !bad.length;
  $("#srcbadwrap summary").textContent = `${bad.length} couldn't be read`;
  $("#srcbad").innerHTML = bad.map(s => `<li>${esc(s.name)}<span>${esc(s.error)}</span></li>`).join("");

  [...new Set(D.jobs.map(j => j.source))].sort().forEach(s => $("#src").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
  const roles = {};
  D.jobs.forEach(j => roles[j.role] = (roles[j.role] || 0) + 1);
  Object.keys(roles).sort((a, b) => roles[b] - roles[a]).forEach(r => $("#role").insertAdjacentHTML("beforeend", `<option value="${esc(r)}">${esc(r)} (${roles[r]})</option>`));
  LEVELS.filter(l => D.jobs.some(j => j.level === l)).forEach(l => $("#level").insertAdjacentHTML("beforeend", `<option>${l}</option>`));
  const allSkills = SKILLS.map(([n]) => n);
  $("#techlist").innerHTML = allSkills.map(k => `<option value="${esc(k)}"></option>`).join("");
  const findSkill = v => allSkills.find(x => x.toLowerCase() === v.trim().toLowerCase());

  // Resume panel (re-rendered, so listen on the container)
  $("#file").addEventListener("change", e => { onFile(e.target.files[0]); e.target.value = ""; });
  $("#me").addEventListener("click", e => {
    const id = e.target.id;
    if (id === "pick") $("#file").click();
    if (id === "pastebtn") { pasting = !pasting; renderMe(); }
    if (id === "usepaste") { const t = $("#pastetext").value; t.trim() ? useResume("Pasted resume", t) : (status = "Paste your resume text first.", renderMe()); }
    if (id === "editbtn") { editing = !editing; renderMe(); }
    if (id === "forget") { me = null; editing = false; store.set("job-radar-resume", null); renderAll(); }
    const k = e.target.dataset?.k;
    if (k && e.target.closest(".xchip")) { me.skills = me.skills.filter(s => s !== k); store.set("job-radar-resume", me); renderAll(); }
  });
  $("#me").addEventListener("change", e => {
    if (e.target.id === "years") { me.years = +e.target.value || null; store.set("job-radar-resume", me); renderAll(); }
    if (e.target.id === "addskill") {
      const k = findSkill(e.target.value);
      if (k && !me.skills.includes(k)) { me.skills = allSkills.filter(s => s === k || me.skills.includes(s)); store.set("job-radar-resume", me); renderAll(); $("#addskill")?.focus(); }
    }
  });

  // Filters
  const press = (group, v) => $(group).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  const sync = () => {
    ["q", "role", "level", "type", "src", "sort"].forEach(k => { $("#" + k).value = state[k]; state[k] = $("#" + k).value; });
    $("#min").value = state.min; $("#minv").textContent = state.min + "%";
    $("#fresh").checked = state.fresh;
    press("#where", state.where); press("#mode", state.mode);
  };
  const set = (k, v) => { state[k] = v; state.limit = 50; render(); };
  $("#q").addEventListener("input", e => set("q", e.target.value));
  ["role", "level", "type", "src", "sort"].forEach(k => $("#" + k).addEventListener("change", e => set(k, e.target.value)));
  $("#min").addEventListener("input", e => { $("#minv").textContent = e.target.value + "%"; set("min", +e.target.value); });
  $("#fresh").addEventListener("change", e => set("fresh", e.target.checked));
  $("#where").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { press("#where", b.dataset.v); set("where", b.dataset.v); } });
  $("#mode").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { press("#mode", b.dataset.v); set("mode", b.dataset.v); } });
  $("#techs").addEventListener("click", e => {
    const b = e.target.closest(".tchip"); if (!b) return;
    set("techs", state.techs.includes(b.dataset.k) ? state.techs.filter(t => t !== b.dataset.k) : [...state.techs, b.dataset.k]);
  });
  const addTech = () => { const k = findSkill($("#techq").value); if (k) { $("#techq").value = ""; if (!state.techs.includes(k)) set("techs", [...state.techs, k]); } };
  $("#techq").addEventListener("change", addTech);
  $("#techq").addEventListener("keydown", e => { if (e.key === "Enter") addTech(); });
  $("#reset").addEventListener("click", () => { Object.assign(state, DEFAULTS, { techs: [] }); sync(); set("limit", 50); });
  $("#more").addEventListener("click", () => { state.limit += 50; render(); });

  $("#how").open = !me;  // show how it works until a resume is added
  sync();
  renderAll();
}
init();
</script>
</body>
</html>
