name: Fetch jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (Remotive asks for at most 4 calls a day)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:                       # re-fetch right away when the rules change
    paths: [config.json, keywords.json, fetch_jobs.py]

permissions:
  contents: write

concurrency: fetch-jobs

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -q
      - run: python3 fetch_jobs.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.js
          git diff --cached --quiet && exit 0
          git commit -m "Refresh job data"
          git pull --rebase --autostash
          git push
